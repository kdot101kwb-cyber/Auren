name: NOVA AUREN Daily Health

on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * *'
  push:
    branches:
      - feat/nova-ai-android-app
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/nova-auren-daily-health.yml'

permissions:
  contents: read

concurrency:
  group: nova-auren-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout AUREN
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: auren-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
