name: AUREN Backend CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - backend/action-executor
          - backend/plugin-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install service dependencies
        working-directory: ${{ matrix.service }}
        run: npm install --no-audit --no-fund
      - name: Syntax check
        working-directory: ${{ matrix.service }}
        run: |
          if [ -f src/server.js ]; then node --check src/server.js; else node --check src/worker.js; fi
      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: npm test

  functions-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Run Functions tests
        working-directory: functions
        run: npm test

  plugin-worker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin worker image
        run: docker build -t auren-plugin-worker:ci backend/plugin-worker
