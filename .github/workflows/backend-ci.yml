name: AUREN Backend CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node-tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service:
          - backend/action-executor
          - backend/plugin-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install service dependencies
        working-directory: ${{ matrix.service }}
        run: npm install --no-audit --no-fund
      - name: Syntax check
        working-directory: ${{ matrix.service }}
        run: |
          if [ -f src/server.js ]; then node --check src/server.js; else node --check src/worker.js; fi
      - name: Run tests with diagnostic capture
        working-directory: ${{ matrix.service }}
        run: |
          set +e
          npm test 2>&1 | tee ci-test.log
          status=${PIPESTATUS[0]}
          echo "npm_test_exit_code=${status}" >> ci-test.log
          exit ${status}

      - name: Upload Node test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-test-diagnostics-${{ matrix.service == 'backend/action-executor' && 'action-executor' || 'plugin-worker' }}
          path: ${{ matrix.service }}/ci-test.log
          if-no-files-found: ignore

  functions-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Run Functions tests with diagnostic capture
        working-directory: functions
        run: |
          set +e
          npm test 2>&1 | tee ci-test.log
          status=${PIPESTATUS[0]}
          echo "npm_test_exit_code=${status}" >> ci-test.log
          exit ${status}

      - name: Upload Functions test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functions-test-diagnostics
          path: functions/ci-test.log
          if-no-files-found: ignore

  plugin-worker-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build plugin worker image
        run: docker build -t auren-plugin-worker:ci backend/plugin-worker
