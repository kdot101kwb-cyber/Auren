name: Functions CI

on:
  push:
    paths:
      - "functions/**"
      - ".github/workflows/functions-tests.yml"
  pull_request:
    paths:
      - "functions/**"
      - ".github/workflows/functions-tests.yml"
  workflow_dispatch:

# Trigger Functions CI on every Functions change.
permissions:
  contents: read

jobs:
  test-functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Functions tests
        run: npm test
