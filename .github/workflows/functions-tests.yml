name: Functions CI

on:
  push:
    paths:
      - "functions/**"
      - ".github/workflows/functions-tests.yml"
  pull_request:
    paths:
      - "functions/**"
      - ".github/workflows/functions-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: functions-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: functions

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - run: npm install

      - run: npm test
