name: AUREN Flutter CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Toolchain diagnostics
        run: |
          flutter --version
          dart --version

      - name: Verify Flutter project
        run: flutter pub get

      - name: Format sources
        run: dart format lib test

      - name: Analyze
        run: |
          set +e
          flutter analyze 2>&1 | tee flutter-analyze.log
          status=${PIPESTATUS[0]}
          echo "flutter_analyze_exit_code=${status}" >> flutter-analyze.log
          exit ${status}

      - name: Upload Analyze diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flutter-analyze-diagnostics
          path: flutter-analyze.log
          if-no-files-found: ignore

      - name: Test
        run: |
          set +e
          flutter test 2>&1 | tee flutter-test.log
          status=${PIPESTATUS[0]}
          echo "flutter_test_exit_code=${status}" >> flutter-test.log
          exit ${status}

      - name: Upload Test diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flutter-test-diagnostics
          path: flutter-test.log
          if-no-files-found: ignore

      - name: Build Android debug APK
        if: ${{ hashFiles('android/**') != '' }}
        run: flutter build apk --debug

      - name: Upload Android debug APK
        if: ${{ hashFiles('android/**') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: auren-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Android platform status
        if: ${{ hashFiles('android/**') == '' }}
        run: echo "Android platform files are not committed yet; Flutter analysis and tests passed, so APK build is skipped."
