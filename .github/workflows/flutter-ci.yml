name: AUREN Flutter CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter project
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        if: ${{ hashFiles('android/**') != '' }}
        run: flutter build apk --debug

      - name: Upload Android debug APK
        if: ${{ hashFiles('android/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: auren-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Android platform status
        if: ${{ hashFiles('android/**') == '' }}
        run: echo "Android platform files are not committed yet; Flutter analysis and tests passed, so APK build is skipped."
