name: AUREN Flutter CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Toolchain diagnostics
        run: |
          flutter --version
          dart --version
      - name: Verify Flutter project
        run: flutter pub get
      - name: Format sources
        run: |
          set +e
          dart format lib test
          status=$?
          if [ "${status}" -eq 65 ]; then
            echo "Formatter reported source changes; continuing to Analyze/Tests."
            exit 0
          fi
          exit ${status}
      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-warnings --no-fatal-infos 2>&1 | tee flutter-analyze.log
          status=${PIPESTATUS[0]}
          echo "flutter_analyze_exit_code=${status}" >> flutter-analyze.log
          exit ${status}
      - name: Upload Analyze diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-diagnostics
          path: flutter-analyze.log
          if-no-files-found: ignore
      - name: Test
        run: |
          set +e
          flutter test 2>&1 | tee flutter-test.log
          status=${PIPESTATUS[0]}
          echo "flutter_test_exit_code=${status}" >> flutter-test.log
          exit ${status}
      - name: Upload Test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-diagnostics
          path: flutter-test.log
          if-no-files-found: ignore
      - name: Ensure Android platform
        run: |
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create . --platforms=android --org com.auren
          fi
          test -f android/app/src/main/AndroidManifest.xml
      - name: Install Android NDK with retry
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          ndk_version="28.2.13676358"
          ndk_dir="$sdk_root/ndk/$ndk_version"
          test -x "$sdkmanager"
          for attempt in 1 2 3; do
            echo "Installing Android NDK $ndk_version (attempt $attempt/3)"
            rm -rf "$ndk_dir"
            # sdkmanager closes stdin after accepting the license; with pipefail,
            # the expected SIGPIPE from yes can incorrectly mark a successful install as failed.
            set +o pipefail
            if yes | "$sdkmanager" --install "ndk;$ndk_version"; then
              install_status=0
            else
              install_status=$?
            fi
            set -o pipefail
            if [ "$install_status" -eq 0 ] && test -f "$ndk_dir/source.properties"; then
              exit 0
            fi
            sleep "$((attempt * 5))"
          done
          echo "Android NDK installation failed after 3 attempts." >&2
          exit 1
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: auren-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
