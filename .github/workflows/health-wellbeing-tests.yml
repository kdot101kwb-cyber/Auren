name: AUREN Health & Wellbeing Tests

on:
  workflow_dispatch:
  push:
    branches:
      - feat/health-wellbeing
      - feat/health-privacy-hardening
      - feat/ai-gateway-failure-safety
      - feat/ai-context-privacy-defaults

permissions:
  contents: read

jobs:
  health-wellbeing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format changed wellbeing and AI gateway sources
        run: dart format lib/services/health/auren_wellbeing_local_store.dart lib/services/health/health_data_sharing_consent.dart lib/services/health/auren_health_repository.dart lib/features/health/presentation/health_wellbeing_screen.dart lib/features/health/presentation/health_sports_screen.dart lib/features/messenger/presentation/messenger_screen.dart lib/features/messenger/presentation/ai_message_privacy_notice.dart lib/services/ai/ai_gateway.dart lib/services/ai/https_ai_gateway.dart test/services/health/auren_wellbeing_local_store_test.dart test/services/health/auren_health_repository_test.dart test/features/health/health_wellbeing_screen_test.dart test/features/messenger/ai_message_privacy_notice_test.dart test/services/ai/ai_gateway_test.dart
      - name: Test local wellbeing domain and storage
        run: flutter test test/services/health/auren_wellbeing_local_store_test.dart
      - name: Test explicit consent gate for remote health data
        run: flutter test test/services/health/auren_health_repository_test.dart
      - name: Test wellbeing screen
        run: flutter test test/features/health/health_wellbeing_screen_test.dart
      - name: Test AI message privacy disclosure
        run: flutter test test/features/messenger/ai_message_privacy_notice_test.dart
      - name: Test AI gateway fallback safety
        run: flutter test test/services/ai/ai_gateway_test.dart
      - name: Test AI personal-context privacy gate
        run: node --test functions/index.test.js
      - name: Analyze wellbeing, AI gateway, and privacy disclosure
        run: flutter analyze lib/services/health/auren_wellbeing_local_store.dart lib/services/health/health_data_sharing_consent.dart lib/services/health/auren_health_repository.dart lib/features/health/presentation/health_wellbeing_screen.dart lib/features/health/presentation/health_sports_screen.dart lib/features/messenger/presentation/messenger_screen.dart lib/features/messenger/presentation/ai_message_privacy_notice.dart lib/services/ai/ai_gateway.dart lib/services/ai/https_ai_gateway.dart
