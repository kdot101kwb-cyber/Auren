name: Firestore Rules Validation

on:
  pull_request:
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "firestore.indexes.json"
      - "functions/*rules*"
      - ".github/workflows/firestore-rules-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Install rules test dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Compile rules and run authorization integration tests in isolated emulator
        run: >-
          firebase emulators:exec --only firestore --project demo-auren-rules
          "node --test functions/action_rules.integration.test.js functions/supplier_rules.integration.test.js functions/education_rules.integration.test.js functions/profile_privacy.integration.test.js"
