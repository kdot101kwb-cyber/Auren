name: Firestore Rules Compile Check

on:
  pull_request:
    paths:
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/firestore-rules-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-firestore-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Compile rules in isolated emulator project
        run: firebase emulators:exec --only firestore --project demo-auren-rules "echo 'Firestore rules compile check passed'"
