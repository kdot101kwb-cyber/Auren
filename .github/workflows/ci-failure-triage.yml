name: AUREN CI Failure Triage

on:
  workflow_run:
    workflows:
      - AUREN Flutter CI
      - AUREN Backend CI
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted default-branch scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download diagnostic artifacts from the completed run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: diagnostics
        continue-on-error: true
      - name: Test triage classifier
        run: node --test scripts/auren_ci_failure_triage.test.js
      - name: Publish sanitized diagnostic summary
        env:
          AUREN_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          AUREN_WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          AUREN_WORKFLOW_RUN_URL: ${{ github.event.workflow_run.html_url }}
          AUREN_DIAGNOSTICS_DIR: diagnostics
        run: node scripts/auren_ci_failure_triage.js >> "$GITHUB_STEP_SUMMARY"
