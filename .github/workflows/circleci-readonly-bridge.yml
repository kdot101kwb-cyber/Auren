name: CircleCI read-only log bridge

on:
  # CircleCI publishes commit statuses to GitHub. Report failed functions tests
  # automatically instead of requiring someone to copy the build number.
  status:
  # Keep a manual fallback for investigating an older CircleCI build.
  workflow_dispatch:
    inputs:
      build_number:
        description: CircleCI job/build number (for example 31837)
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  report:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'status' &&
       github.event.context == 'ci/circleci: functions_tests' &&
       github.event.state == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and publish a sanitized CircleCI failure summary
        env:
          CIRCLECI_API_TOKEN: ${{ secrets.CIRCLECI_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          MANUAL_BUILD_NUMBER: ${{ inputs.build_number }}
          STATUS_TARGET_URL: ${{ github.event.target_url }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: "420"
        run: |
          node <<'NODE'
          const base = 'https://circleci.com/api/v1.1/project/gh/kdot101kwb-cyber/Auren/';
          const token = process.env.CIRCLECI_API_TOKEN;
          const manualBuild = process.env.MANUAL_BUILD_NUMBER || '';
          const targetUrl = process.env.STATUS_TARGET_URL || '';
          const targetMatch = targetUrl.match(/\\/(\\d+)(?:\\/?)(?:[?#].*)?$/);
          const build = manualBuild || (targetMatch && targetMatch[1]);
          if (!token) throw new Error('Missing repository secret CIRCLECI_API_TOKEN');
          if (!/^\\d+$/.test(build || '')) {
            throw new Error('Could not determine CircleCI build number from event target_url or manual input');
          }

          const mask = (s) => String(s)
            .replace(/(gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,})/g, '[REDACTED_TOKEN]')
            .replace(/(Bearer|Circle-Token)\\s+\\S+/gi, '$1 [REDACTED]')
            .replace(/((?:TOKEN|SECRET|PASSWORD|API[_-]?KEY)\\s*[=:]\\s*)\\S+/gi, '$1[REDACTED]')
            .replace(/sk-[A-Za-z0-9_-]{16,}/g, '[REDACTED_KEY]')
            .replace(/((?:https?:\\/\\/)[^\\s:@/]+):([^\\s@/]+)@/gi, '$1:[REDACTED]@');

          async function getJson(url, headers = {}) {
            const res = await fetch(url, { headers });
            if (!res.ok) throw new Error(`CircleCI API request failed: HTTP ${res.status}`);
            return res.json();
          }

          // Avoid duplicate comments when GitHub retries the status event.
          const marker = `<!-- circleci-report:${build} -->`;
          const commentsUrl = `https://api.github.com/repos/${process.env.REPOSITORY}/issues/${process.env.ISSUE_NUMBER}/comments?per_page=100`;
          const commentsRes = await fetch(commentsUrl, {
            headers: {
              'Authorization': `Bearer ${process.env.GH_TOKEN}`,
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28'
            }
          });
          if (!commentsRes.ok) throw new Error(`GitHub comment lookup failed: HTTP ${commentsRes.status}`);
          const comments = await commentsRes.json();
          if (comments.some(comment => (comment.body || '').includes(marker))) {
            console.log(`A report for CircleCI build #${build} already exists; skipping duplicate.`);
            process.exit(0);
          }

          const job = await getJson(base + encodeURIComponent(build), { 'Circle-Token': token });
          const failedSteps = [];
          const matched = [];

          function collectMessages(value, out = []) {
            if (Array.isArray(value)) {
              for (const item of value) collectMessages(item, out);
            } else if (value && typeof value === 'object') {
              if (typeof value.message === 'string') out.push(value.message);
              for (const [key, child] of Object.entries(value)) {
                if (key !== 'message') collectMessages(child, out);
              }
            } else if (typeof value === 'string') {
              out.push(value);
            }
            return out;
          }

          for (const step of (job.steps || [])) {
            for (const action of (step.actions || [])) {
              if (action.status === 'failed') failedSteps.push(step.name || action.name || 'Unnamed step');
              if (!action.output_url) continue;
              const outputRes = await fetch(action.output_url);
              if (!outputRes.ok) {
                matched.push(`Could not retrieve output for step: ${step.name || action.name || 'unnamed'} (HTTP ${outputRes.status})`);
                continue;
              }
              let payload;
              try { payload = await outputRes.json(); } catch {
                matched.push(`Output for step ${step.name || action.name || 'unnamed'} was not valid JSON.`);
                continue;
              }
              const lines = collectMessages(payload).join('\\n').split(/\\r?\\n/);
              for (const line of lines) {
                if (/error|exception|failed|failure|testfailure|expected:|actual:|stack trace|exit code|could not|not found|assertion/i.test(line)) {
                  const safe = mask(line).trim();
                  if (safe) matched.push(safe.slice(0, 500));
                }
              }
            }
          }

          const excerpt = [...new Set(matched)].slice(-60);
          const body = [
            marker,
            '## CircleCI read-only report',
            '',
            `- Build/job: **#${build}**`,
            `- Job: **${mask(job.job_name || job.workflows?.job_name || 'CircleCI job')}**`,
            `- Status: **${mask(job.status || 'unknown')}**`,
            `- Branch: ${mask(job.branch || 'not provided')}`,
            `- Commit: ${mask(job.vcs_revision || 'not provided')}`,
            `- CircleCI: https://circleci.com/gh/kdot101kwb-cyber/Auren/${build}`,
            '',
            '### Failed steps',
            failedSteps.length ? failedSteps.map(x => '- ' + mask(x)).join('\\n') : '- No failed step was identified in the API response.',
            '',
            '### Filtered failure excerpts (sanitized)',
            excerpt.length ? ' ```text\\n' + excerpt.join('\\n').slice(-12000) + '\\n```' : 'No matching error lines were returned. Open the CircleCI job page for the full output.',
            '',
            '> This report contains filtered excerpts only. Secret masking is best-effort; review sensitive logs only in CircleCI.'
          ].join('\\n');

          const response = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/issues/${process.env.ISSUE_NUMBER}/comments`, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${process.env.GH_TOKEN}`,
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ body })
          });
          if (!response.ok) throw new Error(`GitHub report publishing failed: HTTP ${response.status}`);
          const comment = await response.json();
          console.log('Sanitized CircleCI report published:', comment.html_url);
          NODE
