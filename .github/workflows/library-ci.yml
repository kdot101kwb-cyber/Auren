name: AUREN Library CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'lib/features/entertainment/**'
      - 'scripts/library_ci_check.js'
      - '.github/workflows/library-ci.yml'
      - '.github/workflows/reusable-library-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'functions/**'
      - 'lib/features/entertainment/**'
      - 'scripts/library_ci_check.js'
      - '.github/workflows/library-ci.yml'
      - '.github/workflows/reusable-library-check.yml'

permissions:
  contents: read

concurrency:
  group: library-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library-integrity:
    uses: ./.github/workflows/reusable-library-check.yml
    with:
      node-version: "22"
