name: AUREN Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0.0"
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  library-check:
    uses: ./.github/workflows/reusable-library-check.yml
    with:
      node-version: "22"
    permissions:
      contents: read

  flutter-check:
    uses: ./.github/workflows/reusable-flutter-check.yml
    with:
      flutter-channel: "stable"
    permissions:
      contents: read

  release:
    needs: [library-check, flutter-check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version || '' }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android platform
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.auren --project-name auren .
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/applicationId "com\.auren\.auren"/applicationId "com.auren.app"/' android/app/build.gradle
            sed -i 's/namespace "com\.auren\.auren"/namespace "com.auren.app"/' android/app/build.gradle || true
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = "com\.auren\.auren"/applicationId = "com.auren.app"/' android/app/build.gradle.kts
            sed -i 's/namespace = "com\.auren\.auren"/namespace = "com.auren.app"/' android/app/build.gradle.kts || true
          fi
          echo "AUREN Android package target: com.auren.app"

      - name: Verify Firebase project binding
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"default": "auren-90ccc"' .firebaserc
          echo "Firebase project binding verified: auren-90ccc"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Verify Firebase configuration state
        run: |
          set -euo pipefail
          if grep -q "Run flutterfire configure" lib/firebase_options.dart; then
            echo "::warning::Firebase platform options are still placeholders. APK is buildable, but Firebase runtime setup requires generated FlutterFire options."
          else
            echo "Firebase platform options are configured."
          fi

      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: auren-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Build release manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cat > release/release-manifest.json <<EOF
          {
            "name": "AUREN",
            "version": "${{ steps.version.outputs.version }}",
            "commit": "${{ github.sha }}",
            "repository": "${{ github.repository }}",
            "workflow": "${{ github.workflow }}",
            "ref": "${{ github.ref_name }}",
            "androidPackage": "com.auren.app",
            "firebaseProject": "auren-90ccc"
          }
          EOF

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auren-release-${{ steps.version.outputs.version }}
          path: release/release-manifest.json
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.version }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" release/release-manifest.json --title "AUREN $TAG" --generate-notes
          else
            echo "Release $TAG already exists; leaving it unchanged."
          fi
