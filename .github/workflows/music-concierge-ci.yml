name: AUREN Music Concierge CI

on:
  push:
    branches:
      - feat/auren-open-verse-collaboration-v1
    paths:
      - 'lib/services/entertainment/auren_music_prompt_parser.dart'
      - 'lib/services/talent/auren_open_verse_workspace.dart'
      - 'lib/features/talent/presentation/auren_open_verse_screen.dart'
      - 'lib/features/talent/presentation/music_talent_tools.dart'
      - 'test/services/talent/auren_open_verse_workspace_test.dart'
      - 'lib/features/entertainment/presentation/auren_music_concierge_screen.dart'
      - 'test/services/entertainment/auren_music_prompt_parser_test.dart'
      - '.github/workflows/music-concierge-ci.yml'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  pull_request:
    branches: [main]
    paths:
      - 'lib/services/entertainment/auren_music_prompt_parser.dart'
      - 'lib/features/entertainment/presentation/auren_music_concierge_screen.dart'
      - 'test/services/entertainment/auren_music_prompt_parser_test.dart'
      - '.github/workflows/music-concierge-ci.yml'
      - 'pubspec.yaml'
      - 'pubspec.lock'

permissions:
  contents: read

concurrency:
  group: auren-music-concierge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  music-concierge:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Test music prompt parsing
        run: flutter test test/services/entertainment/auren_music_prompt_parser_test.dart test/services/talent/auren_open_verse_workspace_test.dart
      - name: Build Android debug APK
        run: flutter build apk --debug
