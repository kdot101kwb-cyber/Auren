name: Deploy Firestore Rules (STAGING ONLY)

on:
  pull_request:
    paths:
      - ".github/workflows/deploy-staging-firestore-rules.yml"
      - "firestore.rules"
      - "firebase.json"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "functions/*_rules.integration.test.js"
  push:
    branches:
      - "chore/measure-staging-firestore-executable-size"
    paths:
      - ".github/workflows/deploy-staging-firestore-rules.yml"
      - "firestore.rules"
      - "firebase.json"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "functions/*_rules.integration.test.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate-rules:
    name: Validate Firestore rules in isolated emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.34.0

      - name: Install rules test dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Compile rules and run authorization integration tests in isolated emulator
        run: >-
          firebase emulators:exec --only firestore --project demo-auren-rules
          "node --test functions/action_rules.integration.test.js functions/supplier_rules.integration.test.js functions/education_rules.integration.test.js"

  deploy-staging-rules:
    name: Deploy rules to auren-staging only
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: validate-rules
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.34.0

      - name: Validate staging credentials and prepare temporary service account
        env:
          FIREBASE_STAGING_CLIENT_EMAIL: ${{ secrets.FIREBASE_STAGING_CLIENT_EMAIL }}
          FIREBASE_STAGING_PRIVATE_KEY: ${{ secrets.FIREBASE_STAGING_PRIVATE_KEY }}
        run: |
          set -eu
          if [ -z "${FIREBASE_STAGING_CLIENT_EMAIL:-}" ] || [ -z "${FIREBASE_STAGING_PRIVATE_KEY:-}" ]; then
            echo "Missing GitHub Actions secrets FIREBASE_STAGING_CLIENT_EMAIL and/or FIREBASE_STAGING_PRIVATE_KEY."
            exit 1
          fi
          umask 077
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const expectedEmail = 'auren-staging-rules-deployer@auren-staging.iam.gserviceaccount.com';
          const email = process.env.FIREBASE_STAGING_CLIENT_EMAIL.trim();
          let key = process.env.FIREBASE_STAGING_PRIVATE_KEY.trim();
          if (email !== expectedEmail) {
            console.error('Refusing deployment: service account email is not the approved staging deployer.');
            process.exit(1);
          }
          // Accept either the raw private_key PEM or the entire service-account JSON
          // accidentally stored in FIREBASE_STAGING_PRIVATE_KEY.
          if ((key.startsWith('"') && key.endsWith('"')) || (key.startsWith("'") && key.endsWith("'"))) {
            key = key.slice(1, -1);
          }
          if (key.startsWith('{')) {
            try {
              const credentials = JSON.parse(key);
              if (credentials.client_email && credentials.client_email !== expectedEmail) {
                throw new Error('service account email mismatch');
              }
              if (typeof credentials.private_key !== 'string') {
                throw new Error('private_key field missing');
              }
              key = credentials.private_key;
            } catch (_) {
              console.error('Refusing deployment: FIREBASE_STAGING_PRIVATE_KEY contains invalid JSON or a JSON file without private_key.');
              process.exit(1);
            }
          }
          key = key.replace(/\\r\\n/g, '\n').replace(/\\n/g, '\n').replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();
          try {
            key = crypto.createPrivateKey(key).export({ type: 'pkcs8', format: 'pem' }).toString();
          } catch (_) {
            console.error('Refusing deployment: FIREBASE_STAGING_PRIVATE_KEY must contain either the raw private_key value or the full service-account JSON. If it already does, replace it with the complete private_key field from a newly generated staging service-account JSON. Never paste secrets into logs or chat.');
            process.exit(1);
          }
          fs.writeFileSync(process.env.RUNNER_TEMP + '/firebase-staging-service-account.json', JSON.stringify({
            type: 'service_account',
            project_id: 'auren-staging',
            client_email: email,
            private_key: key,
            token_uri: 'https://oauth2.googleapis.com/token'
          }), { mode: 0o600 });
          NODE

      - name: Verify staging service-account authentication without listing projects
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-staging-service-account.json
        run: |
          set -eu
          AUTH_CHECK_DIR="${RUNNER_TEMP}/firebase-auth-check"
          mkdir -p "$AUTH_CHECK_DIR"
          npm install --prefix "$AUTH_CHECK_DIR" --no-audit --no-fund google-auth-library
          NODE_PATH="$AUTH_CHECK_DIR/node_modules" node <<'NODE'
          const { GoogleAuth } = require('google-auth-library');
          (async () => {
            const auth = new GoogleAuth({
              keyFile: process.env.GOOGLE_APPLICATION_CREDENTIALS,
              scopes: ['https://www.googleapis.com/auth/cloud-platform']
            });
            const client = await auth.getClient();
            const token = await client.getAccessToken();
            if (!token || !token.token) {
              throw new Error('Google authentication did not return an access token.');
            }
            console.log('Staging service-account authentication succeeded; access token withheld.');
          })().catch((error) => {
            console.error('Staging service-account authentication failed:', error.message);
            process.exit(1);
          });
          NODE

      - name: Deploy Firestore rules to staging only
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-staging-service-account.json
        run: |
          set -eu
          npx --yes firebase-tools@15.34.0 deploy --only firestore:rules --project auren-staging --non-interactive

      - name: Measure deployed Firestore executable size (staging only)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-staging-service-account.json
        run: |
          set -eu
          SIZE_CHECK_DIR="${RUNNER_TEMP}/firebase-size-check"
          mkdir -p "$SIZE_CHECK_DIR"
          npm install --prefix "$SIZE_CHECK_DIR" --no-audit --no-fund google-auth-library
          NODE_PATH="$SIZE_CHECK_DIR/node_modules" node <<'NODE'
          const { GoogleAuth } = require('google-auth-library');

          (async () => {
            const auth = new GoogleAuth({
              keyFile: process.env.GOOGLE_APPLICATION_CREDENTIALS,
              scopes: ['https://www.googleapis.com/auth/cloud-platform']
            });
            const client = await auth.getClient();
            const token = await client.getAccessToken();
            if (!token || !token.token) {
              throw new Error('Google authentication did not return an access token.');
            }

            const response = await fetch(
              'https://firebaserules.googleapis.com/v1/projects/auren-staging/releases/cloud.firestore:getExecutable',
              { headers: { Authorization: `Bearer ${token.token}` } }
            );
            if (!response.ok) {
              throw new Error(`Could not fetch deployed staging executable: HTTP ${response.status} ${await response.text()}`);
            }

            const result = await response.json();
            if (typeof result.executable !== 'string' || !result.executable.length) {
              throw new Error('Firebase Rules API returned no executable bytes.');
            }
            const sizeBytes = Buffer.from(result.executable, 'base64').length;
            const budgetBytes = 240000;
            const firebaseLimitBytes = 256000;
            console.log(`STAGING_FIRESTORE_EXECUTABLE_SIZE_BYTES=${sizeBytes}`);
            console.log(`STAGING_FIRESTORE_EXECUTABLE_BUDGET_BYTES=${budgetBytes}`);
            console.log(`STAGING_FIRESTORE_EXECUTABLE_LIMIT_BYTES=${firebaseLimitBytes}`);
            if (sizeBytes >= firebaseLimitBytes) {
              throw new Error(`Compiled Firestore executable is ${sizeBytes} bytes; Firebase limit is ${firebaseLimitBytes} bytes.`);
            }
            if (sizeBytes >= budgetBytes) {
              throw new Error(`Compiled Firestore executable is ${sizeBytes} bytes; exceeds the safer project budget of ${budgetBytes} bytes. Reduce the rules size before merging.`);
            }
            console.log('Compiled Firestore executable is below the safer project budget and Firebase limit.');
          })().catch((error) => {
            console.error('Failed to measure deployed staging Firestore executable:', error.message);
            process.exit(1);
          });
          NODE

      - name: Remove temporary credentials
        if: always()
        run: rm -f "${{ runner.temp }}/firebase-staging-service-account.json"
