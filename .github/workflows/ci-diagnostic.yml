name: AUREN CI Runner Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Runner smoke test
        run: |
          echo "AUREN_ACTIONS_RUNNER_STARTED"
          uname -a
          node --version
          git --version

      - name: Checkout
        uses: actions/checkout@v7

      - name: Repository smoke test
        run: |
          test -f pubspec.yaml
          test -f functions/package.json
          echo "AUREN_ACTIONS_RUNNER_OK"
