name: AUREN CI Diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Runner started
        run: |
          echo "runner-started"
          uname -a
          pwd

      - name: Checkout
        uses: actions/checkout@v4

      - name: Node smoke test
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node --version
          npm --version
          echo "node-smoke-ok"

      - name: Flutter smoke test
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - run: |
          flutter --version
          echo "flutter-smoke-ok"
