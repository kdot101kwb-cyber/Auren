name: AUREN CI Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci-diagnostic.yml"

permissions:
  contents: read

jobs:
  runner-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner started
        run: |
          echo "runner-started"
          uname -a
          pwd
      - name: Checkout
        uses: actions/checkout@v4
      - name: Final smoke test
        run: echo "AUREN_ACTIONS_RUNNER_OK"
