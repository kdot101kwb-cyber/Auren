name: AUREN CI Diagnostic

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-smoke-test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04, ubuntu-slim]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Runner started
        run: |
          echo "runner-started on ${{ matrix.runner }}"
          uname -a
          pwd
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node smoke test
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node --version
          npm --version
          echo "node-smoke-ok"
