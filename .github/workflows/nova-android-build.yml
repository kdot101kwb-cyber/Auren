name: NOVA Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/nova-ai-android-app
      - feat/nova-ci-status-verification
      - feat/nova-github-ci-task-execution
    paths:
      - 'nova_ai/**'
      - 'functions/**'
      - '.github/workflows/nova-android-build.yml'
  pull_request:
    branches:
      - main
      - feat/nova-github-ci-task-execution
    paths:
      - 'nova_ai/**'
      - 'functions/**'
      - '.github/workflows/nova-android-build.yml'

# Avoid spending CI time building stale commits when several small commits land
# in quick succession. The latest commit in this branch is the one we need.
concurrency:
  group: nova-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  functions-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test NOVA GitHub CI adapter and worker policy
        run: |
          node --check nova_github_ci_adapter.js
          node --test nova_github_ci_adapter.test.js nova_task_worker.test.js

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nova_ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host files
        run: flutter create --platforms=android --org com.kwb86 --project-name nova_ai .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Report Firebase build configuration
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY || secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID || secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID || secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'auren-90ccc' }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET || secrets.FIREBASE_STORAGE_BUCKET }}
        run: |
          if [ -n "$FIREBASE_API_KEY" ] && [ -n "$FIREBASE_APP_ID" ] && [ -n "$FIREBASE_MESSAGING_SENDER_ID" ] && [ -n "$FIREBASE_PROJECT_ID" ]; then
            echo "NOVA_FIREBASE_CONFIGURED=true" >> "$GITHUB_ENV"
            echo "Firebase build configuration: complete"
          else
            echo "NOVA_FIREBASE_CONFIGURED=false" >> "$GITHUB_ENV"
            echo "::warning::Firebase GitHub Actions variables are incomplete. APK will build, but Firebase-backed NOVA features will remain unavailable."
          fi

      - name: Build debug APK
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY || secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID || secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID || secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'auren-90ccc' }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET || secrets.FIREBASE_STORAGE_BUCKET }}
        run: |
          args=()
          if [ -n "$FIREBASE_API_KEY" ] && [ -n "$FIREBASE_APP_ID" ] && [ -n "$FIREBASE_MESSAGING_SENDER_ID" ] && [ -n "$FIREBASE_PROJECT_ID" ]; then
            args+=("--dart-define=FIREBASE_API_KEY=$FIREBASE_API_KEY")
            args+=("--dart-define=FIREBASE_APP_ID=$FIREBASE_APP_ID")
            args+=("--dart-define=FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID")
            args+=("--dart-define=FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID")
            if [ -n "$FIREBASE_STORAGE_BUCKET" ]; then
              args+=("--dart-define=FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET")
            fi
          fi
          flutter build apk --debug "${args[@]}"

      - name: Write build configuration report
        if: always()
        shell: bash
        run: |
          if [ "${NOVA_FIREBASE_CONFIGURED:-false}" = "true" ]; then
            state="configured"
          else
            state="not_configured"
          fi
          mkdir -p build
          cat > build/nova-build-status.txt <<EOF
          NOVA Android debug build
          Commit: ${GITHUB_SHA}
          Firebase project target: auren-90ccc
          Firebase client configuration: ${state}
          Important: a successful APK build does not mean Firebase Functions are deployed or reachable.
          EOF

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-ai-debug-apk
          path: nova_ai/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build configuration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-ai-build-status
          path: nova_ai/build/nova-build-status.txt
          if-no-files-found: ignore
          retention-days: 14
