name: NOVA Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/nova-ai-android-app
      - feat/nova-50-tool-foundation
    paths:
      - 'nova_ai/**'
      - '.github/workflows/nova-android-build.yml'

# Avoid spending CI time building stale commits when several small commits land
# in quick succession. The latest commit in this branch is the one we need.
concurrency:
  group: nova-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nova_ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host files
        run: flutter create --platforms=android --org com.kwb86 --project-name nova_ai .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-ai-debug-apk
          path: nova_ai/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
