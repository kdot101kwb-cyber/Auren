name: AUREN Automation Inventory

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'functions/**'
      - 'scripts/auren_automation_inventory.js'
      - 'scripts/auren_automation_inventory.test.js'

permissions:
  contents: read

concurrency:
  group: auren-automation-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test inventory and safety checks
        run: node --test scripts/auren_automation_inventory.test.js
      - name: Generate inventory report
        run: |
          node scripts/auren_automation_inventory.js --format markdown | tee automation-inventory.md
          cat automation-inventory.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: auren-automation-inventory
          path: automation-inventory.md
          if-no-files-found: error
          retention-days: 14
