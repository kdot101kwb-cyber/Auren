name: NOVA Wi-Fi Helper CI

on:
  push:
    branches:
      - feat/nova-password-lab
    paths:
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/nova-wifi-helper-ci.yml'
  pull_request:
    branches:
      - feat/nova-autonomous-workspace-market-radar
    paths:
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/nova-wifi-helper-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze lib/features/security/presentation/nova_wifi_helper_screen.dart lib/features/shell/presentation/auren_shell.dart test/features/security/nova_wifi_helper_screen_test.dart --no-fatal-warnings --no-fatal-infos
      - name: Wi-Fi helper tests
        run: flutter test test/features/security/nova_wifi_helper_screen_test.dart
      - name: Build Android debug APK
        run: flutter build apk --debug
