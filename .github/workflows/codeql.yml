name: AUREN CodeQL

on:
  push:
    branches: [main, feat/nova-ai-android-app, feat/nova-free-game-development-toolkit]
    paths:
      - 'functions/**'
      - 'backend/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, feat/nova-ai-android-app, feat/nova-free-game-development-toolkit]
    paths:
      - 'functions/**'
      - 'backend/**'
      - '.github/workflows/**'
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3
