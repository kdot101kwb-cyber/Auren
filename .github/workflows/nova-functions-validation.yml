name: NOVA Functions Validation

on:
  pull_request:
    paths:
      - "functions/**"
      - ".github/workflows/nova-functions-validation.yml"
  push:
    branches:
      - "feat/nova-market-watch-build-agent"
    paths:
      - "functions/**"
      - ".github/workflows/nova-functions-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functions-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Run full Functions test suite
        working-directory: functions
        run: |
          set +e
          npm test 2>&1 | tee ci-test.log
          status=${PIPESTATUS[0]}
          echo "npm_test_exit_code=${status}" >> ci-test.log
          exit ${status}
      - name: Upload Functions test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-functions-validation-log
          path: functions/ci-test.log
          if-no-files-found: warn
