name: AUREN One-Time Dart Formatting

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip-format]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format Dart
        run: dart format lib test
      - name: Commit formatted Dart
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "AUREN CI"
          git config user.email "actions@users.noreply.github.com"
          git add lib test
          git commit -m "Format Dart sources [skip-format]"
          git push
