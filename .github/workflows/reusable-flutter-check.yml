name: AUREN Reusable Flutter Check

on:
  workflow_call:
    inputs:
      flutter-channel:
        required: false
        type: string
        default: "stable"

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter-channel }}
          cache: true

      - name: Prepare Android platform
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.auren --project-name auren .
          else
            echo "Android platform already exists."
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/applicationId "com\.auren\.auren"/applicationId "com.auren.app"/' android/app/build.gradle
            sed -i 's/namespace "com\.auren\.auren"/namespace "com.auren.app"/' android/app/build.gradle || true
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = "com\.auren\.auren"/applicationId = "com.auren.app"/' android/app/build.gradle.kts
            sed -i 's/namespace = "com\.auren\.auren"/namespace = "com.auren.app"/' android/app/build.gradle.kts || true
          fi
          echo "AUREN Android package target: com.auren.app"

      - name: Verify Firebase project binding
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"default": "auren-90ccc"' .firebaserc
          echo "Firebase project binding verified: auren-90ccc"

      - name: Get dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: auren-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
