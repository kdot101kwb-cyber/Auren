name: NOVA Functions CI

on:
  push:
    branches:
      - feat/nova-ai-android-app
      - feat/nova-application-factory-market-scout
      - feat/nova-shared-task-contract-v1
      - feat/nova-exact-action-approval-security
      - feat/nova-action-risk-registry
      - chunk/fix-action-rules-emulator-gate
      - chunk/fix-firestore-modular-api-30989
    paths:
      - "functions/**"
      - ".github/workflows/nova-functions-ci.yml"
      - ".github/workflows/nova-android-build.yml"
  pull_request:
    branches:
      - main
      - feat/nova-ai-android-app
      - feat/nova-application-factory-market-scout
      - feat/nova-shared-task-contract-v1
      - feat/nova-exact-action-approval-security
      - feat/nova-action-risk-registry
      - chunk/fix-action-rules-emulator-gate
    paths:
      - "functions/**"
      - ".github/workflows/nova-functions-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-functions-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functions-tests:
    name: Functions syntax and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Functions dependencies (match CircleCI)
        run: npm install --no-audit --no-fund
      - name: Report resolved Firebase test SDK versions
        run: npm ls firebase @firebase/rules-unit-testing
      - name: Run backend syntax and unit tests
        run: npm test
