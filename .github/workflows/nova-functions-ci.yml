name: NOVA Functions CI

on:
  push:
    branches:
      - feat/nova-ai-android-app
      - feat/nova-free-game-development-toolkit
      - feat/nova-department-agent-adapters
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firebase.json"
      - "firestore.indexes.json"
      - ".github/workflows/nova-functions-ci.yml"
  pull_request:
    branches:
      - main
      - feat/nova-ai-android-app
      - feat/nova-free-game-development-toolkit
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firebase.json"
      - "firestore.indexes.json"
      - ".github/workflows/nova-functions-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-functions-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functions-tests:
    name: Functions syntax and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Firebase runtime packages
        run: npm install --no-save firebase-admin firebase-functions
      - name: Run backend syntax and unit tests
        run: npm test

  firestore-rules:
    name: Firestore rules authorization tests (emulator only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Install rules test dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund firebase @firebase/rules-unit-testing
      - name: Compile rules and run authorization integration tests in isolated emulator
        run: >-
          firebase emulators:exec --only firestore --project demo-auren-rules
          "node --test functions/action_rules.integration.test.js functions/supplier_rules.integration.test.js functions/education_rules.integration.test.js"
