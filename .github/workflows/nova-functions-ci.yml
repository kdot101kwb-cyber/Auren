name: NOVA Functions CI

on:
  push:
    branches:
      - feat/nova-ai-android-app
      - feat/nova-free-game-development-toolkit
    paths:
      - "functions/**"
      - ".github/workflows/nova-functions-ci.yml"
  pull_request:
    branches:
      - main
      - feat/nova-ai-android-app
    paths:
      - "functions/**"
      - ".github/workflows/nova-functions-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-functions-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functions-tests:
    name: Functions syntax and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Firebase runtime packages
        run: npm install --no-save firebase-admin firebase-functions
      - name: Run backend syntax and unit tests
        run: npm test
