name: NOVA Offline Feature CI

on:
  pull_request:
    branches:
      - feat/nova-ai-android-app
    paths:
      - 'nova_ai/**'
      - '.github/workflows/nova-offline-ci.yml'
  push:
    branches:
      - feat/nova-offline-income-planner
    paths:
      - 'nova_ai/**'
      - '.github/workflows/nova-offline-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-offline-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nova_ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host files
        run: flutter create --platforms=android --org com.kwb86 --project-name nova_ai .

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format lib/services/offline/nova_offline_store.dart test/services/offline/nova_offline_store_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nova-offline-debug-apk
          path: nova_ai/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
