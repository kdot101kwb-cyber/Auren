version: 2.1

jobs:
  flutter_ci:
    docker:
      - image: ghcr.io/gmeligio/flutter-android:3.47.2
    steps:
      - checkout
      - restore_cache:
          keys:
            - flutter-deps-v3-{{ .Branch }}
            - flutter-deps-v3
      - run:
          name: Flutter version
          command: flutter --version && dart --version
      - run:
          name: Get dependencies
          command: flutter pub get
      - save_cache:
          key: flutter-deps-v3-{{ .Branch }}
          paths:
            - ~/.pub-cache
      - run:
          name: Prepare Android NDK
          command: |
            set -e
            SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
            SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
            NDK_VERSION="28.2.13676358"
            NDK_DIR="${SDK_ROOT}/ndk/${NDK_VERSION}"
            if [ ! -d "${NDK_DIR}" ]; then
              rm -rf "${NDK_DIR}"
              rm -rf "${SDK_ROOT}/.temp"/* || true
              for attempt in 1 2 3; do
                echo "Installing Android NDK ${NDK_VERSION} (attempt ${attempt}/3)"
                yes | "${SDKMANAGER}" --licenses >/dev/null 2>&1 || true
                if "${SDKMANAGER}" --install "ndk;${NDK_VERSION}"; then break; fi
                rm -rf "${NDK_DIR}"
                rm -rf "${SDK_ROOT}/.temp"/* || true
                if [ "${attempt}" -eq 3 ]; then echo "ERROR: Failed to install Android NDK ${NDK_VERSION} after 3 attempts."; exit 1; fi
                sleep 5
              done
            fi
            test -d "${NDK_DIR}"
            echo "Android NDK ready: ${NDK_DIR}"
      - run:
          name: Format check
          command: |
            set +e
            dart format --output=none lib test > flutter_format.log 2>&1
            status=$?
            echo "flutter_format_exit_code=$status" >> flutter_format.log
            cat flutter_format.log
            exit 0
      - run:
          name: Analyze
          command: |
            set +e
            flutter analyze lib test --no-fatal-warnings --no-fatal-infos > flutter_analyze.log 2>&1
            status=$?
            echo "flutter_analyze_exit_code=$status" >> flutter_analyze.log
            echo "$status" > /tmp/flutter_analyze_status
            cat flutter_analyze.log
            exit 0
      - run:
          name: Test
          command: |
            set +e
            flutter test > flutter_test.log 2>&1
            status=$?
            echo "flutter_test_exit_code=$status" >> flutter_test.log
            echo "$status" > /tmp/flutter_test_status
            cat flutter_test.log
            exit 0
      - run:
          name: Android build
          command: |
            set +e
            flutter build apk --debug > flutter_android_build.log 2>&1
            status=$?
            echo "flutter_android_build_exit_code=$status" >> flutter_android_build.log
            echo "$status" > /tmp/flutter_android_build_status
            cat flutter_android_build.log
            exit 0
      - store_artifacts:
          path: flutter_format.log
      - store_artifacts:
          path: flutter_analyze.log
      - store_artifacts:
          path: flutter_test.log
      - store_artifacts:
          path: flutter_android_build.log
      - run:
          name: Report Flutter CI result
          command: |
            analyze_status=0
            test_status=0
            build_status=0
            read analyze_status < /tmp/flutter_analyze_status
            read test_status < /tmp/flutter_test_status
            read build_status < /tmp/flutter_android_build_status
            echo "========== FLUTTER CI SUMMARY =========="
            echo "Flutter analyze: ${analyze_status}"
            echo "Flutter test: ${test_status}"
            echo "Android debug build: ${build_status}"
            echo
            echo "========== ANALYZE ERRORS =========="
            grep -E "^[[:space:]]*(error|warning)[[:space:]]|^[[:space:]]*error •|^[[:space:]]*warning •" flutter_analyze.log | tail -n 80 || true
            echo
            echo "========== TEST FAILURES =========="
            grep -E "FAILED|Error:|Exception:|Test failed|Some tests failed|Expected:|Actual:" flutter_test.log | tail -n 80 || true
            echo
            echo "========== BUILD ERRORS =========="
            grep -E "ERROR:|FAILURE:|error:|Exception:|Execution failed|What went wrong|Could not" flutter_android_build.log | tail -n 100 || true
            echo
            echo "========== LAST ANALYZE LINES =========="
            tail -n 40 flutter_analyze.log
            echo
            echo "========== LAST TEST LINES =========="
            tail -n 40 flutter_test.log
            echo
            echo "========== LAST BUILD LINES =========="
            tail -n 60 flutter_android_build.log
            if [ "${analyze_status}" -ne 0 ] || [ "${test_status}" -ne 0 ] || [ "${build_status}" -ne 0 ]; then exit 1; fi

  nova_flutter_ci:
    docker:
      - image: ghcr.io/gmeligio/flutter-android:3.47.2
    steps:
      - checkout
      - restore_cache:
          keys:
            - nova-flutter-deps-v2-{{ .Branch }}
            - nova-flutter-deps-v2
      - run:
          name: NOVA Flutter version
          command: cd nova_ai && flutter --version && dart --version
      - run:
          name: Install NOVA dependencies
          command: cd nova_ai && flutter pub get
      - save_cache:
          key: nova-flutter-deps-v2-{{ .Branch }}
          paths:
            - ~/.pub-cache
      - run:
          name: Analyze NOVA package
          command: cd nova_ai && flutter analyze
      - run:
          name: Test NOVA package
          command: cd nova_ai && flutter test
      - run:
          name: Generate and normalize NOVA Android platform files
          command: |
            set -e
            cd nova_ai
            if [ ! -x android/gradlew ] || { [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; }; then
              echo "Generating NOVA Android wrapper and host files."
              flutter create --platforms=android --org com.auren --project-name nova .
            fi

            # Flutter 3.47.2 requires Kotlin >= 2.2.20. Keep AGP/Gradle on the
            # compatible pre-AGP-9 toolchain and explicitly disable AGP-9-only switches.
            SETTINGS=""
            if [ -f android/settings.gradle.kts ]; then SETTINGS="android/settings.gradle.kts"; fi
            if [ -f android/settings.gradle ]; then SETTINGS="android/settings.gradle"; fi
            test -n "$SETTINGS"

            if grep -q 'com.android.application' "$SETTINGS"; then
              if grep -q 'id("com.android.application")' "$SETTINGS"; then
                sed -i -E '/id\("com.android.application"\)/s/version "[^"]+"/version "8.11.1"/' "$SETTINGS"
              else
                sed -i -E "/com.android.application/s/version ['\"][^'\"]+['\"]/version '8.11.1'/" "$SETTINGS"
              fi
            fi
            if grep -q 'org.jetbrains.kotlin.android' "$SETTINGS"; then
              if grep -q 'id("org.jetbrains.kotlin.android")' "$SETTINGS"; then
                sed -i -E '/id\("org.jetbrains.kotlin.android"\)/s/version "[^"]+"/version "2.2.20"/' "$SETTINGS"
              else
                sed -i -E "/org.jetbrains.kotlin.android/s/version ['\"][^'\"]+['\"]/version '2.2.20'/" "$SETTINGS"
              fi
            fi

            sed -i 's#gradle-[0-9.]*-all.zip#gradle-8.14.3-all.zip#' android/gradle/wrapper/gradle-wrapper.properties

            touch android/gradle.properties
            for setting in android.newDsl android.builtInKotlin; do
              if grep -q "^$setting=" android/gradle.properties; then
                sed -i "s/^$setting=.*/$setting=false/" android/gradle.properties
              else
                echo "$setting=false" >> android/gradle.properties
              fi
            done

            echo "NOVA Android toolchain after normalization:"
            grep -E 'com.android.application|org.jetbrains.kotlin.android' "$SETTINGS"
            grep -E '^distributionUrl=|^android.newDsl=|^android.builtInKotlin=' android/gradle/wrapper/gradle-wrapper.properties android/gradle.properties
            grep -q '8.11.1' "$SETTINGS"
            grep -q '2.2.20' "$SETTINGS"
            grep -q 'gradle-8.14.3-all.zip' android/gradle/wrapper/gradle-wrapper.properties
            grep -q '^android.newDsl=false$' android/gradle.properties
            grep -q '^android.builtInKotlin=false$' android/gradle.properties
            test -f android/gradlew
            test -f android/app/build.gradle -o -f android/app/build.gradle.kts
      - run:
          name: Build NOVA Android debug APK
          command: |
            set -e
            cd nova_ai
            SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
            SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
            NDK_VERSION="28.2.13676358"
            NDK_DIR="${SDK_ROOT}/ndk/${NDK_VERSION}"
            if [ ! -d "${NDK_DIR}" ]; then
              yes | "${SDKMANAGER}" --licenses >/dev/null 2>&1 || true
              "${SDKMANAGER}" --install "ndk;${NDK_VERSION}"
            fi
            flutter build apk --debug

  functions_tests:
    docker:
      - image: cimg/node:22.15
    steps:
      - checkout
      - restore_cache:
          keys:
            - functions-node-v4-
            - functions-node-v4
      - run:
          name: Install Functions dependencies
          command: |
            cd functions
            npm install --include=dev --no-audit --no-fund
            echo "========== RESOLVED FIREBASE TEST SDK VERSIONS =========="
            npm ls --include=dev firebase @firebase/rules-unit-testing
      - save_cache:
          key: functions-node-v4-{{ .Branch }}
          paths:
            - functions/node_modules
      - run:
          name: Run Functions tests
          command: |
            cd functions
            set +e
            npm test 2>&1 | tee functions_test.log
            status=${PIPESTATUS[0]}
            echo "npm_test_exit_code=$status" >> functions_test.log
            exit $status
      - run:
          name: Firestore Rules source size guard
          command: |
            set -e
            bytes=$(wc -c < firestore.rules)
            max_bytes=258000
            echo "firestore.rules bytes: $bytes"
            if [ "$bytes" -ge "$max_bytes" ]; then
              echo "ERROR: firestore.rules is too close to Firebase's 256 KiB source limit."
              exit 1
            fi
            echo "Firestore Rules source-size guard passed."
      - run:
          name: Run Firestore Action Rules emulator gate
          command: |
            set -e
            if ! java -version >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y openjdk-21-jre-headless
            fi
            npx --yes firebase-tools emulators:exec --project auren-emulator --only firestore "node --test functions/action_rules.integration.test.js" 2>&1 | tee firestore_action_rules.log
            status=${PIPESTATUS[0]}
            echo "firestore_action_rules_exit_code=$status" >> firestore_action_rules.log
            exit $status
      - store_artifacts:
          path: functions/functions_test.log
      - store_artifacts:
          path: firestore_action_rules.log

  action_executor_tests:
    docker:
      - image: cimg/node:20.19
    steps:
      - checkout
      - restore_cache:
          keys:
            - action-executor-node-v1-
            - action-executor-node-v1
      - run:
          name: Install Action Executor dependencies
          command: cd backend/action-executor && npm install --no-audit --no-fund
      - save_cache:
          key: action-executor-node-v1-{{ .Branch }}
          paths:
            - backend/action-executor/node_modules
      - run:
          name: Syntax check
          command: cd backend/action-executor && node --check src/server.js
      - run:
          name: Run tests
          command: |
            cd backend/action-executor
            set +e
            npm test 2>&1 | tee action_executor_test.log
            status=${PIPESTATUS[0]}
            echo "npm_test_exit_code=$status" >> action_executor_test.log
            exit $status
      - store_artifacts:
          path: backend/action-executor/action_executor_test.log

  plugin_worker_tests:
    docker:
      - image: cimg/node:20.19
    steps:
      - checkout
      - restore_cache:
          keys:
            - plugin-worker-node-v1-
            - plugin-worker-node-v1
      - run:
          name: Install Plugin Worker dependencies
          command: cd backend/plugin-worker && npm install --no-audit --no-fund
      - save_cache:
          key: plugin-worker-node-v1-{{ .Branch }}
          paths:
            - backend/plugin-worker/node_modules
      - run:
          name: Syntax check
          command: cd backend/plugin-worker && node --check src/worker.js
      - run:
          name: Run tests
          command: |
            cd backend/plugin-worker
            set +e
            npm test 2>&1 | tee plugin_worker_test.log
            status=${PIPESTATUS[0]}
            echo "npm_test_exit_code=$status" >> plugin_worker_test.log
            exit $status
      - store_artifacts:
          path: backend/plugin-worker/plugin_worker_test.log

  plugin_worker_image:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Plugin Worker image
          command: docker build -t auren-plugin-worker:ci backend/plugin-worker

workflows:
  auren_ci:
    jobs:
      - flutter_ci
      - nova_flutter_ci
      - functions_tests
      - action_executor_tests
      - plugin_worker_tests
      - plugin_worker_image
