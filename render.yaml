services:
  - type: web
    name: auren-action-executor
    runtime: docker
    dockerfilePath: ./backend/action-executor/Dockerfile
    dockerContext: ./backend/action-executor
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: AUREN_PLUGIN_WORKER_URL
        fromService:
          name: auren-plugin-worker
          type: pserv
          property: hostport
      - key: AUREN_PLUGIN_WORKER_SECRET
        fromService:
          name: auren-plugin-worker
          type: pserv
          envVarKey: WORKER_SHARED_SECRET
      - key: AUREN_PLUGIN_SIGNING_SECRET
        generateValue: true
      - key: AUREN_STORAGE_BUCKET
        sync: false
      - key: AUREN_AI_BASE_URL
        sync: false
      - key: AUREN_AI_API_KEY
        sync: false
      - key: AUREN_AI_MODEL
        sync: false

  - type: pserv
    name: auren-plugin-worker
    runtime: docker
    dockerfilePath: ./backend/plugin-worker/Dockerfile
    dockerContext: ./backend/plugin-worker
    envVars:
      - key: PORT
        value: "8090"
      - key: PLUGIN_TIMEOUT_MS
        value: "5000"
      - key: WORKER_SHARED_SECRET
        generateValue: true
